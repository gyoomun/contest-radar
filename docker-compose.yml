name: contest-radar
services:
  db:
    image: postgres:17
    container_name: research-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research # 로컬 전용
      TZ: Asia/Seoul
    ports:
      - "15434:5432"
    volumes:
      - research-pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/002_links_detail.sql:/docker-entrypoint-initdb.d/02-links-detail.sql:ro
      - ./db/003_marks.sql:/docker-entrypoint-initdb.d/03-marks.sql:ro
      - ./db/004_prize.sql:/docker-entrypoint-initdb.d/04-prize.sql:ro
      - ./db/005_prize_won.sql:/docker-entrypoint-initdb.d/05-prize-won.sql:ro
      - ./db/006_total_support.sql:/docker-entrypoint-initdb.d/06-total-support.sql:ro
      - ./db/007_norm_title_keep_paren.sql:/docker-entrypoint-initdb.d/07-norm-title.sql:ro
      - ./db/008_notice_alias.sql:/docker-entrypoint-initdb.d/08-notice-alias.sql:ro
      - ./db/009_apply_end_time.sql:/docker-entrypoint-initdb.d/09-apply-end-time.sql:ro

volumes:
  research-pgdata:
    name: 06research_research-pgdata # 폴더를 옮기기 전에 만든 볼륨. 이름을 바꾸면 빈 DB로 뜬다
